<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>67 鬧鐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
  /* One full-screen alarm: huge flashing 67 over the camera feed, a progress meter at the bottom. */
  :root {
    --bg: #12091f;
    --fg: #fff6e0;
    --hot: #ff3d6e;
    --warn: #ffd23f;
    --ok: #3dffa8;
    --dim: rgba(255, 246, 224, .55);
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body);
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  #cam {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); opacity: .35; filter: saturate(1.4);
  }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
  .stage {
    position: relative; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; text-align: center;
    padding-block: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  }
  .clock { font-family: var(--display); font-size: clamp(28px, 7vw, 48px); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .big {
    font-family: var(--display); font-size: clamp(140px, 42vw, 360px); line-height: .9;
    color: var(--hot); text-shadow: 0 0 40px rgba(255, 61, 110, .6);
  }
  body.ringing .big { animation: shake .3s infinite; }
  body.ringing { animation: flash .6s steps(1) infinite; }
  @keyframes flash { 50% { background: #2a0a1a; } }
  @keyframes shake {
    0%, 100% { transform: rotate(-4deg) scale(1); }
    50% { transform: rotate(4deg) scale(1.06); }
  }
  .hint { font-size: clamp(16px, 4.2vw, 22px); font-weight: 900; max-width: 32ch; text-wrap: balance; }
  .sub { font-size: 14px; color: var(--dim); margin-top: 6px; }
  .meter { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  .pip {
    width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--dim);
    display: grid; place-items: center; font-family: var(--display); font-size: 20px; color: var(--dim);
    transition: all .15s;
  }
  .pip.on { border-color: var(--warn); background: var(--warn); color: var(--bg); transform: scale(1.12); }
  .hands { font-size: 13px; color: var(--dim); margin-top: 10px; }
  .hands b { color: var(--warn); }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; text-align: center; background: var(--bg);
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
    z-index: 5;
  }
  .screen h1 { font-family: var(--display); font-size: clamp(64px, 20vw, 140px); margin: 0; color: var(--hot); line-height: 1; }
  .screen p { margin: 0; max-width: 34ch; line-height: 1.6; color: var(--dim); }
  button {
    font: 900 20px var(--body); color: var(--bg); background: var(--warn);
    border: 0; border-radius: 999px; padding: 18px 40px; cursor: pointer;
  }
  button:focus-visible { outline: 4px solid var(--fg); outline-offset: 4px; }
  #done h1 { color: var(--ok); }
  .err { color: var(--hot) !important; font-weight: 900; }
  @media (prefers-reduced-motion: reduce) {
    body.ringing, body.ringing .big { animation: none; }
  }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="overlay"></canvas>

<div class="stage">
  <div class="clock" id="clock">--:--</div>
  <div class="big" id="big">67</div>
  <div>
    <div class="hint" id="hint">雙手掌心朝上，像秤東西一樣一上一下交替擺動</div>
    <div class="meter" id="meter"></div>
    <div class="hands" id="hands">載入手勢辨識中…</div>
  </div>
</div>

<div class="screen" id="start">
  <h1>67</h1>
  <p>鬧鐘響了！瀏覽器規定要點一下才能出聲。點了之後它會一直喊 six seven，直到你對鏡頭比出 67 手勢。</p>
  <button id="go">開始（我醒了一半）</button>
  <p class="sub">需要相機權限，畫面只在你的手機上處理，不會上傳。</p>
</div>

<div class="screen" id="done" hidden>
  <h1>早安</h1>
  <p id="doneText">67 成功，鬧鐘關掉了。</p>
  <button id="again">再響一次</button>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const NEED = 4;            // alternations (up/down swaps) needed to dismiss
const WINDOW_MS = 3000;    // they must happen within this window
const $ = (id) => document.getElementById(id);
const video = $("cam"), canvas = $("overlay"), ctx = canvas.getContext("2d");

// ---------- clock ----------
const tick = () => {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
};
tick(); setInterval(tick, 1000);

// ---------- meter ----------
for (let i = 0; i < NEED; i++) {
  const p = document.createElement("div");
  p.className = "pip"; p.textContent = i % 2 ? "7" : "6";
  $("meter").appendChild(p);
}
const setMeter = (n) => [...$("meter").children].forEach((p, i) => p.classList.toggle("on", i < n));

// ---------- sound: beeps + voice ----------
let ringing = false, audioCtx, beepTimer;
function beep() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [0, 0.18].forEach((off, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = i ? 660 : 880;
    g.gain.setValueAtTime(0.0001, t + off);
    g.gain.exponentialRampToValueAtTime(0.25, t + off + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.15);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + off); o.stop(t + off + 0.16);
  });
}
function say() {
  if (!ringing || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance("six seven, six seven, six seven, six seven");
  u.lang = "en-US"; u.rate = 1.25; u.pitch = 1.3; u.volume = 1;
  u.onend = () => setTimeout(say, 150);
  u.onerror = () => setTimeout(say, 800);
  speechSynthesis.speak(u);
}
function startRing() {
  ringing = true;
  document.body.classList.add("ringing");
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  clearInterval(beepTimer);
  beepTimer = setInterval(beep, 1200);
  beep();
  if ("speechSynthesis" in window) { speechSynthesis.cancel(); say(); }
  let flip = false;
  clearInterval(startRing.t);
  startRing.t = setInterval(() => { if (ringing) $("big").textContent = (flip = !flip) ? "6" : "7"; }, 300);
}
function stopRing() {
  ringing = false;
  document.body.classList.remove("ringing");
  clearInterval(beepTimer); clearInterval(startRing.t);
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("big").textContent = "67";
}

// ---------- gesture detection ----------
let landmarker, lastVideoTime = -1;
let ema = 0, side = 0, swaps = [];

async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate,
    },
    runningMode: "VIDEO", numHands: 2,
  });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
  video.srcObject = stream;
  await video.play();
}

// Palm center = average of wrist and the four finger-base knuckles.
const palm = (lm) => {
  const ids = [0, 5, 9, 13, 17];
  const x = ids.reduce((s, i) => s + lm[i].x, 0) / ids.length;
  const y = ids.reduce((s, i) => s + lm[i].y, 0) / ids.length;
  const size = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
  return { x, y, size };
};

function draw(hands) {
  canvas.width = innerWidth; canvas.height = innerHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // match object-fit: cover
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(canvas.width / vw, canvas.height / vh);
  const ox = (canvas.width - vw * s) / 2, oy = (canvas.height - vh * s) / 2;
  ctx.fillStyle = "#ffd23f";
  for (const lm of hands) for (const p of lm) {
    ctx.beginPath(); ctx.arc(ox + p.x * vw * s, oy + p.y * vh * s, 5, 0, 7); ctx.fill();
  }
}

function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  const hands = res.landmarks || [];
  draw(hands);
  if (!ringing) return;

  const now = performance.now();
  swaps = swaps.filter((t) => now - t < WINDOW_MS);

  if (hands.length < 2) {
    $("hands").innerHTML = hands.length ? "看到 <b>1</b> 隻手，要兩隻手" : "鏡頭裡沒看到手";
    setMeter(swaps.length);
    return;
  }
  // left/right by x position, then compare heights
  const [a, b] = hands.map(palm).sort((p, q) => p.x - q.x);
  const diff = a.y - b.y;
  ema = ema * 0.5 + diff * 0.5;
  const thr = 0.45 * (a.size + b.size) / 2;   // relative to hand size, works near or far

  const now_side = ema > thr ? 1 : ema < -thr ? -1 : 0;
  if (now_side !== 0 && now_side !== side) {
    if (side !== 0) swaps.push(now);
    side = now_side;
  }
  $("hands").innerHTML = `看到 <b>2</b> 隻手，繼續上下交替！`;
  setMeter(swaps.length);

  if (swaps.length >= NEED) dismiss();
}

function dismiss() {
  stopRing();
  swaps = []; side = 0; setMeter(0);
  const t = new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  $("doneText").textContent = `${t} 成功比出 67，鬧鐘關掉了。`;
  $("done").hidden = false;
}

// ---------- start ----------
$("go").addEventListener("click", async () => {
  $("start").hidden = true;
  startRing();
  try {
    await startCamera();
    $("hands").textContent = "載入手勢辨識中…";
    await loadModel();
    $("hands").textContent = "準備好了，舉起雙手";
    loop();
  } catch (e) {
    console.error(e);
    $("hint").textContent = "開不了相機，所以關不掉（這就是重點）。請允許相機權限後重新整理。";
    $("hint").classList.add("err");
    $("hands").textContent = String(e && e.message || e);
  }
});
$("again").addEventListener("click", () => { $("done").hidden = true; startRing(); });

// Try to ring right away; most browsers block sound until a tap, so the start screen stays as backup.
try {
  const probe = new (window.AudioContext || window.webkitAudioContext)();
  if (probe.state === "running") { audioCtx = probe; }
  else probe.close();
} catch {}
</script>
</body>
</html>
